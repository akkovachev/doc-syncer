name: "Reusable Workflow — Doc-Sync Engine"

on:
  # 1. Called as a reusable workflow by consumer repositories (`org/internal-tools/.github/workflows/doc-sync.yml@v1`)
  workflow_call:
    inputs:
      config_path:
        description: "Repo-relative path to .doc-sync.yml"
        required: false
        type: string
        default: ".doc-sync.yml"
      environment:
        description: "GitHub Deployment Environment holding scoped Confluence secrets"
        required: false
        type: string
        default: "confluence-sync"
      dry_run:
        description: "Run in dry-run mode without writing to Confluence"
        required: false
        type: boolean
        default: false
      drift_check:
        description: "Inspect remote Confluence page versions even if local Markdown hashes are unchanged"
        required: false
        type: boolean
        default: false
      tools_ref:
        description: "Pinned release tag/ref of org/internal-tools to execute"
        required: false
        type: string
        default: "main"
    secrets:
      CONFLUENCE_BASE_URL:
        required: false   # not needed for dry runs
      CONFLUENCE_PAT:
        required: false   # not needed for dry runs
      DOC_SYNC_SLACK_WEBHOOK:
        required: false

  # 2. Direct triggers on this repository (push on Markdown files, manual dispatch, nightly drift check)
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".doc-sync.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no writes to Confluence)"
        required: false
        type: boolean
        default: true
      drift_check:
        description: "Run drift detection against remote Confluence versions"
        required: false
        type: boolean
        default: false
  schedule:
    # Nightly drift detection at 02:00 UTC
    - cron: "0 2 * * *"

permissions:
  id-token: write       # GitHub OIDC token generation (Section 3.5)
  contents: read        # Checkout source repository
  pull-requests: write  # Post advisory PR doc-completeness / conflict diff comments

jobs:
  doc-sync:
    name: "Sync Markdown → Confluence"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repository
        uses: actions/checkout@v4
        with:
          path: caller-repo
          fetch-depth: 0

      - name: Checkout Centralized Internal Tooling Suite
        uses: actions/checkout@v4
        with:
          repository: akkovachev/doc-syncer   # NOTE: github.repository is the *caller* inside workflow_call
          ref: ${{ inputs.tools_ref || 'main' }}
          path: internal-tools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Internal Tooling Suite (`tools` CLI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./internal-tools

      - name: Restore Doc-Sync State Cache
        uses: actions/cache@v4
        with:
          path: caller-repo/.doc-sync-cache.json
          key: doc-sync-state-${{ github.repository }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            doc-sync-state-${{ github.repository }}-${{ github.ref_name }}-
            doc-sync-state-${{ github.repository }}-

      - name: Validate `.doc-sync.yml` Schema
        working-directory: caller-repo
        run: |
          tools doc-sync validate-config --config "${{ inputs.config_path || '.doc-sync.yml' }}"

      - name: Execute Doc-Sync Engine
        working-directory: caller-repo
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_PAT: ${{ secrets.CONFLUENCE_PAT }}
          DOC_SYNC_SLACK_WEBHOOK: ${{ secrets.DOC_SYNC_SLACK_WEBHOOK }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          elif [ -z "$CONFLUENCE_PAT" ] || [ -z "$CONFLUENCE_BASE_URL" ]; then
            echo "::warning::Confluence secrets are not configured - forcing --dry-run"
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          fi
          if [ "${{ inputs.drift_check }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --drift-check"
          fi
          tools doc-sync sync \
            --config "${{ inputs.config_path || '.doc-sync.yml' }}" \
            --cache-file ".doc-sync-cache.json" \
            $EXTRA_FLAGS

      - name: Render XHTML artifact (dry-run only)
        if: ${{ inputs.dry_run == true || github.event_name == 'workflow_dispatch' }}
        working-directory: caller-repo
        run: |
          tools doc-sync dry-run --config "${{ inputs.config_path || '.doc-sync.yml' }}" --output-dir ./dist/xhtml

      - name: Upload rendered XHTML
        if: ${{ inputs.dry_run == true || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: confluence-xhtml
          path: caller-repo/dist/xhtml
          if-no-files-found: warn
