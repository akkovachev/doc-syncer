name: "Internal Tools — Doc-Sync Composite Action"
description: "Installs the centralized Internal Tooling Suite CLI and runs `tools doc-sync`"
inputs:
  command:
    description: "doc-sync subcommand to execute (sync | dry-run | validate-config | pr-check)"
    required: false
    default: "sync"
  config-path:
    description: "Repo-relative path to .doc-sync.yml"
    required: false
    default: ".doc-sync.yml"
  cache-path:
    description: "Path to the state cache JSON file"
    required: false
    default: ".doc-sync-cache.json"
  extra-args:
    description: "Optional extra CLI flags (e.g. --drift-check)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Internal Tooling Suite
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e "${{ github.action_path }}/../../.."

    - name: Run tools doc-sync
      shell: bash
      run: |
        tools doc-sync ${{ inputs.command }} \
          --config "${{ inputs.config-path }}" \
          --cache-file "${{ inputs.cache-path }}" \
          ${{ inputs.extra-args }}
